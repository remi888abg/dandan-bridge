<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:monospace;padding:12px;background:#111;color:#0f0;font-size:12px;line-height:1.5}.e{color:red}.ok{color:#0f0}.w{color:yellow}</style></head>
<body><h3>诊断 v5: SW 排查 + 修复</h3><div id=l></div>
<script>
var l=document.getElementById('l');function p(m,c){var d=document.createElement('div');d.className=c||'';d.textContent=m;l.appendChild(d);}

if (!navigator.serviceWorker) { p('无 navigator.serviceWorker', 'w'); }
else {
  p('开始注销所有 Service Worker...');
  navigator.serviceWorker.getRegistrations().then(function(regs){
    p('找到 ' + regs.length + ' 个注册');
    var done=0;
    if (regs.length === 0) {
      p('没有SW注册，开始测试加载', 'ok');
      doTest();
    } else {
      regs.forEach(function(r){
        p('注销: ' + (r.scope || '?'));
        r.unregister().then(function(ok){p('  结果: ' + (ok?'OK':'FAIL'), ok?'ok':'e');done++;if(done===regs.length)doTest();});
      });
    }
  });
}

function doTest(){
  p('清理缓存...');
  if (window.caches) {
    caches.keys().then(function(keys){
      p('找到 ' + keys.length + ' 个缓存');
      keys.forEach(function(k){caches.delete(k).then(function(){});});
      setTimeout(startTest, 800);
    });
  } else {
    startTest();
  }
}

function startTest(){
  p('开始加载 app-core.js (无 SW)...');
  var s=document.createElement('script');
  s.src='app-core.js?v=' + Date.now();
  s.onload=function(){p('app-core.js 加载成功!', 'ok');setTimeout(function(){
    var checks=[['pdfjsLib',typeof window.pdfjsLib],['init',typeof init],['seedPreset',typeof seedPreset],['db',typeof db]];
    checks.forEach(function(c){p('  '+c[0]+': '+c[1], c[1]==='undefined'?'e':'ok');});
  },300);};
  s.onerror=function(){p('app-core.js 加载失败', 'e');};
  document.head.appendChild(s);
}
</script></body></html>
